<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" preserveAspectRatio="none">
  <foreignObject width="1200" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" class="root">
      <style>
        .root {
          display: flex;
          height: 100%;
          width: 100%;
          padding: 0 20px;
          gap: 20px;
          align-items: center;
        }
        .dot {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          flex-shrink: 0;
        }
        .title {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          font-size: 40px;
        }
        .line {
          position: absolute;
          width: 100%;
          height: 2px;
          bottom: 0;
          background-color: black
        }
        @media (prefers-color-scheme: dark) {
          .title {
            color: white;
          }
          .line {
            background-color: white;
          }
        }
      </style>
      <div class="dot" style="background-color: red;"></div>
      <div class="dot" style="background-color: yellow;"></div>
      <div class="dot" style="background-color: lime;"></div>
      <span class="title">tree.mermaid</span>
      <div class="line"></div>
    </div>
  </foreignObject>
</svg>
