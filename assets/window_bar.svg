<svg xmlns="http://www.w3.org/2000/svg" width="900" height="48" viewBox="0 0 900 48">
  <defs>
    <style>
      .bar {
        width: 900px;
        height: 48px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        color: #000;
        border-bottom: 2px solid #000;
      }

      .buttons {
        position: absolute;
        left: 16px;
        display: flex;
        gap: 10px;
      }

      .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        color-adjust: exact;
      }

      .red { background: red; }
      .yellow { background: yellow; }
      .green { background: lime; }

      @media (prefers-color-scheme: dark) {
        .bar {
          color: #fff;
          border-bottom: 2px solid #fff;
        }
      }
    </style>
  </defs>
  <foreignObject width="900" height="48">
    <div xmlns="http://www.w3.org/1999/xhtml" class="bar">
      <div class="buttons">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      tree.mermaid
    </div>
  </foreignObject>
</svg>
